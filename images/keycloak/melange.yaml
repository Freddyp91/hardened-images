# Keycloak built from source (git tag) with Maven. No upstream binaries are used.
# package.version and expected-commit are maintained by scripts/check-upstream.mjs
# (the "Watch upstream" workflow). Bump epoch to force a package rebuild.
package:
  name: keycloak
  version: 26.8.2
  epoch: 0
  description: Open Source Identity and Access Management
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # kc.sh is a /bin/sh script that uses dirname, readlink, grep, etc.
      - bash
      - busybox
      - openjdk-21-jre
      - openjdk-21-default-jvm

vars:
  # CVE remediation. Each override must keep the melange and smoke tests green, and
  # should be dropped once upstream ships the fix.
  #
  # Extra -D flags for versions Keycloak exposes as Maven properties.
  maven-overrides: >-
    -Dmariadb-jdbc.version=3.5.11
  # Managed dependencies inserted at the top of the root pom's dependencyManagement,
  # so they win over the Quarkus BOM.
  managed-dependency-overrides: |
    <!-- hardened-images overrides -->
    <dependency>
      <groupId>com.google.guava</groupId>
      <artifactId>guava</artifactId>
      <version>33.7.2-jre</version>
    </dependency>
    <dependency>
      <groupId>io.opentelemetry</groupId>
      <artifactId>opentelemetry-bom</artifactId>
      <version>1.67.0</version>
      <type>pom</type>
      <scope>import</scope>
    </dependency>

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - bash
      - busybox
      - ca-certificates-bundle
      - git
      - libstdc++   # node (used by the admin console build) needs it
      - openssl-3.6-libssl  # Kiota (.NET, admin client generator) needs libssl.so.3
      - maven
      - openjdk-21
      - openjdk-21-default-jdk
  environment:
    JAVA_HOME: /usr/lib/jvm/java-21-openjdk
    LANG: en_US.UTF-8
    MAVEN_OPTS: -Xmx3g
    # The admin/account consoles are built with pnpm + wireit during the Maven build.
    CI: "true"
    WIREIT_CACHE: none
    WIREIT_LOGGER: simple
    # Kiota (.NET, generates the admin client) needs ICU unless globalization is invariant.
    DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    # ts-node hides TypeScript diagnostics behind an opaque error on Node 24; transpile
    # only, and let the tsc step that follows do the type check with readable output.
    TS_NODE_TRANSPILE_ONLY: "true"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/keycloak/keycloak
      tag: ${{package.version}}
      expected-commit: e514445f9dcdabc5bdcf67cab56c1e49655de067

  - name: Apply dependency overrides
    runs: |
      cat > /tmp/overrides.xml <<'OVERRIDES'
      ${{vars.managed-dependency-overrides}}
      OVERRIDES
      # Insert right after the first <dependencies> inside <dependencyManagement>.
      awk 'FNR==NR { buf = buf $0 "\n"; next }
           /<dependencyManagement>/ { dm = 1 }
           { print }
           dm && !done && /<dependencies>/ { printf "%s", buf; done = 1 }' /tmp/overrides.xml pom.xml > pom.xml.new
      mv pom.xml.new pom.xml
      grep -q 'hardened-images overrides' pom.xml
      sed -n '/<dependencyManagement>/,/hardened-images overrides/p' pom.xml | tail -3

  - name: Build distribution with Maven
    runs: |
      # /var/cache/melange is persisted between CI runs (Maven repository cache).
      mvn -B -ntp \
        -Dmaven.repo.local=/var/cache/melange/m2 \
        -Dmaven.build.cache.enabled=false \
        -DskipTests -DskipExamples -DskipTestsuite \
        -pl quarkus/deployment,quarkus/dist -am \
        ${{vars.maven-overrides}} \
        install

  - name: Install
    runs: |
      dist=quarkus/dist/target/keycloak-${{package.version}}.tar.gz
      test -f "$dist"
      mkdir -p ${{targets.destdir}}/opt/keycloak ${{targets.destdir}}/usr/bin
      tar -xzf "$dist" -C ${{targets.destdir}}/opt/keycloak --strip-components=1
      # Windows launchers are not needed in a Linux image.
      rm -f ${{targets.destdir}}/opt/keycloak/bin/*.bat
      mkdir -p ${{targets.destdir}}/opt/keycloak/data
      ln -s /opt/keycloak/bin/kc.sh ${{targets.destdir}}/usr/bin/kc.sh
      # Some archive entries come out world-writable; nothing in the package should be.
      chmod -R go-w ${{targets.destdir}}/opt/keycloak

# Package tests run with `melange test` in CI before any image is assembled.
test:
  environment:
    contents:
      keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
      repositories:
        - https://packages.wolfi.dev/os
      packages:
        - busybox
  pipeline:
    - name: Files are installed
      runs: |
        test -x /opt/keycloak/bin/kc.sh
        test -f /opt/keycloak/version.txt
        test -d /opt/keycloak/lib
        grep -q "${{package.version}}" /opt/keycloak/version.txt
    - name: Launcher interpreter and JVM resolve
      runs: |
        head -n1 /opt/keycloak/bin/kc.sh
        interp=$(head -n1 /opt/keycloak/bin/kc.sh | sed 's/^#! *//; s/ .*//')
        test -x "$interp"
        java -version
    - name: CVE overrides shipped
      runs: |
        cd /opt/keycloak/lib/lib/main
        ls | grep -E 'guava|mariadb-java-client|opentelemetry-api-[0-9]'
        ls | grep -q 'com.google.guava.guava-33.7.2-jre.jar'
        ls | grep -q 'org.mariadb.jdbc.mariadb-java-client-3.5.11.jar'
        ls | grep -q 'io.opentelemetry.opentelemetry-api-1.67.0.jar'
    - name: kc.sh runs
      runs: |
        /opt/keycloak/bin/kc.sh --version | tee /tmp/kc-version
        grep -q "${{package.version}}" /tmp/kc-version
