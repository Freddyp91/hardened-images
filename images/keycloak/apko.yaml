# Minimal Keycloak runtime image on Wolfi. No shell beyond bash (required by kc.sh),
# no package manager, runs as non-root UID 1000 (same UID as the upstream image).
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - /work/melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - '@local /work/packages'
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - keycloak@local

accounts:
  groups:
    - groupname: keycloak
      gid: 1000
  users:
    - username: keycloak
      uid: 1000
      gid: 1000
      shell: /sbin/nologin
  run-as: 1000

paths:
  # kc.sh build / start-dev write augmentation output and H2 data under /opt/keycloak.
  - path: /opt/keycloak
    type: permissions
    uid: 1000
    gid: 1000
    permissions: 0o755
    recursive: true

work-dir: /opt/keycloak

environment:
  JAVA_HOME: /usr/lib/jvm/default-jvm
  PATH: /usr/lib/jvm/default-jvm/bin:/opt/keycloak/bin:/usr/sbin:/usr/bin:/sbin:/bin
  LANG: en_US.UTF-8
  # Dev mode binds to localhost by default, which makes `docker run -p 8080:8080` unreachable.
  KC_HTTP_HOST: 0.0.0.0

entrypoint:
  command: /opt/keycloak/bin/kc.sh

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.title: keycloak
  org.opencontainers.image.description: Hardened Keycloak image built on Wolfi
  org.opencontainers.image.licenses: Apache-2.0
